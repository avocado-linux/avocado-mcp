# ExecuTorch leaks an absolute build-dir tree into DESTDIR. The first fix
# (rm -rf ${D}/work) is a TRAP: it only cleans the leak when TOPDIR happens to
# be /work. Under a different TOPDIR (e.g. /avocado-build) the tree survives and
# fails the installed-vs-shipped QA. The durable fix is TOPDIR-independent.

normalized_signature: >-
  ERROR: QA Issue: executorch: Files/directories were installed but not shipped
  in any package:
    /work/build-qemuarm64<WORKDIR>
    /work/build-qemuarm64<WORKDIR>
    /usr/share/cpuinfo/cpuinfo-config.cmake
    /usr/lib/cpuinfo.h
  executorch: 18 installed and not shipped files. [installed-vs-shipped]

  ERROR: Fatal QA errors were found, failing task.

  ERROR: <PKG> do_package: Fatal QA errors were found, failing task.
failed_task: do_package
build_system: cmake
root_cause: The cmake install put static libs at an absolute build-dir path
  (leaking the whole ${B} tree into ${D}) and a bundled dep installed cmake
  files and a header to nonstandard locations, none of which the default FILES
  capture. The leaked tree is at ${B} (absolute), NOT at a fixed /work - it
  moves with TOPDIR.
fix_diff: >-
  Relocate the libs to ${libdir} and capture the stray cmake/header in FILES,
  then remove the leaked tree TOPDIR-INDEPENDENTLY. Do not hardcode ${D}/work:
  ${B} is absolute, so ${D}${B} is the leaked dir under any TOPDIR; rm it and
  rmdir -p the now-empty parents (which stops at the non-empty ${D}).

  --- a/executorch_1.3.1.bb

  +++ b/executorch_1.3.1.bb

  +do_install:append() {

  +    if [ -d "${D}${B}/lib" ]; then

  +        install -m 0644 ${D}${B}/lib/*.a ${D}${libdir}/

  +    fi

  -    rm -rf "${D}/work"

  +    rm -rf "${D}${B}"

  +    rmdir -p "$(dirname "${D}${B}")" 2>/dev/null || true

  +}

  +FILES:${PN}-dev += "${libdir}/cmake ${libdir}/pkgconfig ${libdir}/cpuinfo.h
  ${datadir}/cpuinfo"

  +ALLOW_EMPTY:${PN} = "1"
doc_link: https://docs.yoctoproject.org/ref-manual/qa-checks.html#installed-vs-shipped
falsifier: do_package and do_package_qa pass under any TOPDIR (verified with
  TOPDIR=/work and TOPDIR=/avocado-build); the -staticdev package ships the
  lib*.a and no leaked build tree or unshipped cmake/header remains.
verified: true
source: dogfood-imx93-frdm
