name: Schema drift

# Compares the vendored starter template with avocado-cli main. Upstream can
# change at any time, so this runs on a schedule and only on PRs that touch
# the vendored files, not on every PR. The schema is not vendored: the MCP
# reads it from the installed CLI.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/lib/schema/**'
      - 'scripts/sync-schema.mjs'
      - '.github/workflows/schema-drift.yml'

jobs:
  schema-drift:
    name: Vendored template matches avocado-cli main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Compare with avocado-cli main
        run: node scripts/sync-schema.mjs --check
